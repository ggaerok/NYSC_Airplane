<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>타겟 선택</title>
<link rel="stylesheet" href="style.css">
<script src="sync.js"></script>
</head>
<body>
<div id="stage">
  <a class="menu-back" href="index.html">◀ 모드 선택</a>
  <div class="menu-band"><div class="menu-title">🎯 타겟을 선택하세요</div></div>
  <div class="menu-sub">원하는 타겟을 누르면 게임이 시작됩니다</div>
  <div class="cards" id="cards"></div>
</div>
<script src="vendor/qrcode.js"></script>
<script src="targets.js"></script>
<script>
  const { el, renderZones, fit } = TG_UTIL;
  const cards = document.getElementById('cards');
  TARGETS.forEach(T => {
    const a = document.createElement('a');
    a.className = 'card'; a.href = T.file;
    a.innerHTML = `<svg></svg><div class="info"><div class="no">TARGET ${T.id}</div><div class="nm">${T.name}</div><div class="ds">${T.desc.replace(/\n/g, '<br>')}</div></div>`;
    const svg = a.querySelector('svg');
    svg.setAttribute('viewBox', T.view.join(' '));
    renderZones(svg, T, null);
    cards.appendChild(a);
  });
  fit();
  TG_SYNC.mountPill(document.getElementById('stage'));   // 연동 모드면 연결 상태 + QR 안내
</script>
</body>
</html>
