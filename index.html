<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>타겟 점수 게임</title>
<link rel="stylesheet" href="style.css">
<script src="sync.js"></script>
</head>
<body>
<div id="stage">
  <div class="menu-band"><div class="menu-title">🎯 진행 방식을 선택하세요</div></div>
  <button class="newroom" id="newroom" type="button">새 방 만들기</button>
  <div class="modes">
    <a class="mode" id="m-solo" href="select.html">
      <div class="ic">🖥️</div>
      <div class="nm">PC 단독</div>
      <div class="ds">PC에서만 점수를 올립니다<br>인터넷 연결이 필요 없습니다</div>
    </a>
    <a class="mode" id="m-link" href="select.html">
      <div class="ic">📱</div>
      <div class="nm">모바일 연동</div>
      <div class="ds">휴대폰에서 눌러도 PC 화면에<br>점수가 바로 반영됩니다</div>
    </a>
  </div>
  <form class="joinrow" id="join" autocomplete="off">
    <span>휴대폰이라면 방 코드로 참가</span>
    <input id="code" maxlength="6" placeholder="방 코드 6자리" inputmode="latin" autocapitalize="characters">
    <button type="submit">참가</button>
  </form>
</div>
<script src="vendor/qrcode.js"></script>
<script src="targets.js"></script>
<script>
  const S = TG_SYNC;
  // QR로 들어온 경우(?room=) → 이미 연동 모드로 설정되어 있으니 바로 타겟 선택으로
  if (new URLSearchParams(location.search).get('room')) location.replace('select.html');
  document.getElementById('m-solo').addEventListener('click', () => S.setSolo());
  // 휴대폰에서는 새 방을 만들지 않고 방 코드를 입력하게 함 (PC와 다른 방에 들어가는 실수 방지)
  document.getElementById('m-link').addEventListener('click', e => {
    if (S.layout === 'side') { e.preventDefault(); document.getElementById('code').focus(); return; }
    S.setLink(S.lastRoom() || S.genRoom()); S.showQrNext();
  });
  document.getElementById('newroom').addEventListener('click', () => { S.setLink(S.genRoom()); S.showQrNext(); location.href = 'select.html'; });
  document.getElementById('join').addEventListener('submit', e => {
    e.preventDefault();
    const c = document.getElementById('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.length !== 6) { document.getElementById('code').focus(); return; }
    S.setLink(c); location.href = 'select.html';
  });
  TG_UTIL.fit();
</script>
</body>
</html>
